[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "PySide6>=6.6.0",
    "shiboken6>=6.6.0",
    "shiboken6-generator>=6.6.0",
    "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyQtIndustrialWidget"
version = "0.1.0"
description = "PySide6 / Qt 6 Python bindings for QtIndustrialWidgets library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Paolo Sereno", email = "pablitos1024@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/paolosereno/pyQtIndustrialWidget"
Upstream = "https://github.com/paolosereno/QtIndustrialWidgets"

[tool.scikit-build]
cmake.version = ">=3.20"
ninja.version = ">=1.10"
cmake.build-type = "Release"
wheel.packages = ["pyQtIndustrialWidget"]
strict-config = false
