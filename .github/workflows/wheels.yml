name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt (Windows & macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2019_64' || 'clang_64' }}
          modules: 'qtbase'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* pp* *i686"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_LINUX: "yum install -y mesa-libGL-devel libxkbcommon-devel libxslt-devel || apk add mesa-dev libxkbcommon-dev || apt-get update && apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxslt1-dev || true"
          CIBW_BEFORE_BUILD: "pip install \"scikit-build-core>=0.9.0\" \"ninja\" \"PySide6>=6.6.0\" \"shiboken6>=6.6.0\" \"shiboken6-generator>=6.6.0\""
          CIBW_ENVIRONMENT_LINUX: 'QT_QPA_PLATFORM="offscreen"'
          CIBW_ENVIRONMENT_MACOS: 'QT_QPA_PLATFORM="offscreen"'
          CIBW_ENVIRONMENT_WINDOWS: 'QT_QPA_PLATFORM="offscreen"'
          CIBW_TEST_REQUIRES: "PySide6>=6.6.0"
          CIBW_TEST_COMMAND: "python -m unittest {project}/tests/test_basic.py"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist --outdir dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist/
          merge-multiple: true

      - name: Display downloaded artifacts
        run: ls -la release-dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
